<meta name="theme-color" content="#0B416B">
<script>
  // Roda antes do CSS pintar a tela — evita um flash claro→escuro no load
  // pra quem já escolheu modo escuro antes. Só o atributo no <html>; a troca
  // de variável em si é toda em CSS, escopada em #app (style.css).
  //
  // Primeiro acesso é SEMPRE claro, mesmo com o sistema operacional em modo
  // escuro (decisão explícita do usuário, 2026-07-12) — não olha
  // prefers-color-scheme de propósito. Só muda depois que a pessoa escolhe
  // no toggle (aí sim persiste via localStorage, pros 3 papéis).
  //
  // UX-14 (auditoria 2026-08-23): a barra do navegador também é ajustada
  // aqui, no mesmo passo. Antes o theme-color ficava fixo no azul-marinho do
  // <meta> e só era corrigido por applyTheme() quando a pessoa ALTERNAVA o
  // tema — quem já usava modo escuro via a barra clara em todo carregamento.
  (function () {
    try {
      var saved = localStorage.getItem('siges-theme');
      var dark = saved === 'dark';
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#0F161F' : '#0B416B');
    } catch (e) { /* localStorage indisponível (ex: modo privado) — segue claro */ }
  })();
</script>

<!--
  SEC-06 (auditoria 2026-08-23). Três mudanças nestas tags:

  1. Versão FIXA. `@supabase/supabase-js@2` era uma faixa aberta — qualquer
     2.x publicada entrava em produção sem ninguém aprovar. 2.112.3 é
     exatamente o que a faixa aberta já servia (conferido byte a byte).

  2. `integrity` + `crossorigin`. Sem isso, um comprometimento do CDN
     executaria código com acesso total à sessão, incluindo o token do
     Supabase no localStorage. O navegador agora recusa qualquer arquivo que
     não bata com o hash. ATENÇÃO: ao trocar de versão, o hash TEM que ser
     recalculado junto (openssl dgst -sha384 -binary arquivo | openssl base64 -A),
     senão o script simplesmente não carrega.

  3. xlsx saiu de 0.18.5 (última no npm, com CVE conhecido de poluição de
     protótipo e ReDoS) para 0.20.3, distribuída pelo CDN oficial da SheetJS —
     as correções nunca foram publicadas no npm.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3"
        integrity="sha384-l8ah+VgaWtk1mvOe9VC+OirC6qHFF4yH7l7mKRidV9MSti3E9F463bMp6ZVN4kuC"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"
        integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk"
        crossorigin="anonymous"></script>
<!-- Chart.js 4.4.7 (gráficos). Usa chart.umd.js — o arquivo REAL do pacote npm,
     já minificado — e não chart.umd.min.js: esse é gerado na hora pelo jsdelivr
     (não existe no npm) e o hash dele pode mudar se o CDN trocar de minificador,
     quebrando o SRI sem aviso. O sha384 abaixo foi calculado sobre o arquivo e o
     sha256 conferido contra o que o próprio jsdelivr publica para ele. -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"
        integrity="sha384-zYPBGXwO4633CABX/5Spf6emCKUJCfoOkhOMYyxMsatqQZPnDblmmOewfjsIVWCM"
        crossorigin="anonymous"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"

<script>
  document.getElementById('sidebar-logo-svg').innerHTML = Icons.logo;
  document.getElementById('topbar-signout').innerHTML = Icons.logout;
  document.getElementById('sidebar-signout-icon').innerHTML = Icons.logout;
  document.getElementById('sidebar-signout').onclick = handleSignOut;
  document.getElementById('topbar-theme-toggle').innerHTML = currentTheme() === 'dark' ? Icons.sun : Icons.moon;
  document.getElementById('topbar-theme-toggle').onclick = toggleTheme;

  // UX-10: o service worker antigo assumia no meio da sessão (skipWaiting +
  // clients.claim), misturando o JS já carregado com arquivos novos. Agora a
  // versão nova FICA ESPERANDO e o app convida a recarregar — quem estiver no
  // meio de um cadastro não perde o que digitou.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        if (reg.waiting) notifyUpdateReady(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            // controller != null significa que já havia uma versão rodando —
            // sem isso, o convite apareceria no PRIMEIRO acesso de todo mundo.
            if (sw.state === 'installed' && navigator.serviceWorker.controller) notifyUpdateReady(sw);
          });
        });
      }).catch(() => {});

      let reloading = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
    });
  }
</script>
